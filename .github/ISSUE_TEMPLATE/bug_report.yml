name: "🐛 Bug Report"
description: "Report a reproducible bug or unexpected behavior in Mailbunker."
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please fill out the form below to help us investigate and resolve it quickly.

  - type: input
    id: version
    attributes:
      label: "Mailbunker Version"
      description: "Which version of Mailbunker are you using? (e.g. `0.1.0` or git commit SHA)"
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      description: "What operating system are you running Mailbunker on?"
      options:
        - macOS (Apple Silicon / M-Series)
        - macOS (Intel)
        - Linux (Ubuntu / Debian)
        - Linux (Arch / Fedora / Other)
        - Windows (WSL2)
        - Docker
    validations:
      required: true

  - type: dropdown
    id: python-version
    attributes:
      label: "Python Version"
      description: "Which Python version are you using?"
      options:
        - Python 3.10
        - Python 3.11
        - Python 3.12
        - Python 3.13
        - Python 3.14
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the behavior."
      placeholder: |
        1. Run 'mailbunker sync'
        2. Execute 'mailbunker search ...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs / Terminal Output"
      description: "Please paste any relevant console logs or stack traces (ensure passwords or private email contents are redacted)."
      render: shell

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
